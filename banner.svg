<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mahoraga" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1850"/>
      <stop offset=".5" stop-color="#15132f"/>
      <stop offset="1" stop-color="#0e0d22"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="150" y1="70" x2="310" y2="230">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#e8a93a"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1c7"/>
      <stop offset="1" stop-color="#f0b84a"/>
    </linearGradient>
    <radialGradient id="gl">
      <stop offset="0" stop-color="#f5c85c" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f5c85c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="sword">
      <polygon points="230,127 225.5,80 234.5,80" fill="#ffe9ae" stroke="#f5c85c" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="230" y1="124" x2="230" y2="84" stroke="#e8a93a" stroke-width="1.2"/>
      <line x1="218" y1="77" x2="242" y2="77" stroke="#f5c85c" stroke-width="5" stroke-linecap="round"/>
      <line x1="230" y1="77" x2="230" y2="64" stroke="#e8a93a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="230" cy="59" r="5" fill="#f5c85c"/>
    </g>
  </defs>

  <style>
    .ring1{stroke-dasharray:365;stroke-dashoffset:365;animation:d1 7s ease-in-out infinite}
    .ring2{stroke-dasharray:165;stroke-dashoffset:165;animation:d2 7s ease-in-out infinite}
    .sp{opacity:0;animation:sp 7s ease-in-out infinite}
    .spin{transform-origin:230px 150px;animation:spin 30s linear infinite}
    .pulse{transform-origin:230px 150px;animation:pulse 3.5s ease-in-out infinite}
    .t{opacity:0;animation:fade 7s ease-in-out infinite}
    .t2{animation-delay:.25s}
    .t3{animation-delay:.5s}
    .p{animation:float 6s ease-in-out infinite}
    @keyframes d1{0%{stroke-dashoffset:365}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-365}}
    @keyframes d2{0%,8%{stroke-dashoffset:165}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-165}}
    @keyframes sp{0%,25%{opacity:0}45%,85%{opacity:1}100%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes fade{0%,12%{opacity:0;transform:translateX(-14px)}35%,85%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(10px)}}
    @keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-18px);opacity:.55}}
  </style>

  <rect width="900" height="300" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="260" rx="24" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>

  <circle class="p" cx="520" cy="60" r="3" fill="#f5c85c"/>
  <circle class="p" cx="700" cy="240" r="4" fill="#e8a93a" style="animation-delay:1s"/>
  <circle class="p" cx="820" cy="90" r="3" fill="#ffe29a" style="animation-delay:2s"/>
  <circle class="p" cx="400" cy="250" r="2.5" fill="#f5c85c" style="animation-delay:3s"/>
  <circle class="p" cx="840" cy="200" r="2" fill="#ffffff" style="animation-delay:4s"/>
  <circle class="p" cx="130" cy="50" r="2.5" fill="#ffe29a" style="animation-delay:1.5s"/>

  <circle class="pulse" cx="230" cy="150" r="110" fill="url(#gl)"/>

  <g class="spin" filter="url(#glow)">
    <g stroke="url(#gold)" stroke-linecap="round" fill="none">
      <circle class="ring1" cx="230" cy="150" r="58" stroke-width="5" transform="rotate(-90 230 150)"/>
      <circle class="ring2" cx="230" cy="150" r="26" stroke-width="4" transform="rotate(-90 230 150)"/>
    </g>
    <g class="sp">
      <use xlink:href="#sword" href="#sword"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(45 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(90 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(135 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(180 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(225 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(270 230 150)"/>
      <use xlink:href="#sword" href="#sword" transform="rotate(315 230 150)"/>
      <circle cx="230" cy="150" r="8" fill="#f5c85c"/>
    </g>
  </g>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text class="t" x="360" y="150" font-size="64" font-weight="800" letter-spacing="6" fill="url(#tx)">MAHORAGA</text>
    <text class="t t2" x="364" y="188" font-size="20" fill="#cfc8ff">Pencatatan Keuangan </text>
    <text class="t t3" x="364" y="222" font-size="14" letter-spacing="2" fill="#c9a14a">8 PILAR FINANSIAL  •  OFFLINE PENUH  •  DATA DI HP</text>
  </g>
</svg>
  
