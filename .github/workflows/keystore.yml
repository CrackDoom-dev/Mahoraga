name: Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: Password keystore (minimal 8 karakter, tanpa spasi)
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -keystore mahoraga.keystore -alias mahoraga \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Mahoraga"
          keytool -list -keystore mahoraga.keystore -storepass "$PW"
          echo "===== SALIN DARI BARIS BAWAH SEBAGAI KEYSTORE_BASE64 ====="
          base64 mahoraga.keystore
          echo "===== SELESAI ====="

      - uses: actions/upload-artifact@v4
        with:
          name: mahoraga-keystore
          path: mahoraga.keystore
          
